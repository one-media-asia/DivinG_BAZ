# nginx server block for diving.onemedia.asia
# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name diving.onemedia.asia www.diving.onemedia.asia;
    
    # Allow certbot validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl http2;
    server_name diving.onemedia.asia www.diving.onemedia.asia;

    # SSL certificates (update paths if using different cert locations)
    ssl_certificate /etc/letsencrypt/live/diving.onemedia.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diving.onemedia.asia/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 90;
    }
}
